<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sheets Connected App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; color: #333; padding: 20px; display: flex; justify-content: center; }
    .container { background: white; padding: 25px; border-radius: 12px; max-width: 500px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { margin-bottom: 20px; color: #1a73e8; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
    button:disabled { background: #9bbdff; }
    #status { margin-top: 15px; text-align: center; font-size: 14px; font-weight: bold; }
    .success { color: #2e7d32; }
    .error { color: #d32f2f; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Submit Data to Google Sheet</h2>
    
    <form id="sheetForm">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="Enter your name">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" rows="4" required placeholder="Write your message..."></textarea>
      </div>

      <button type="submit" id="submitBtn">Send to Sheet</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    // ⚠️ REPLACE THIS WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxMMQgImJPqt-VgaxfWfAAWEcL9LM6ZMQtk7K9GVRqZD5EW1bM2m_5iftYDNpOQqe2gIg/exec";

    const form = document.getElementById('sheetForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');

    // Handle Form Submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.innerText = "Sending...";
      statusDiv.className = "";
      statusDiv.innerText = "";

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };

      try {
        // Send POST request to Google Apps Script
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Avoid CORS preflight block
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === 'success') {
          statusDiv.className = "success";
          statusDiv.innerText = "Data successfully sent to Google Sheet!";
          form.reset();
        } else {
          throw new Error(result.message || "Something went wrong.");
        }
      } catch (err) {
        statusDiv.className = "error";
        statusDiv.innerText = "Error: " + err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Send to Sheet";
      }
    });
  </script>

</body>
</html>
