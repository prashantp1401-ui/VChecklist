<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Life Dashboard</title>
  <!-- Chart.js for visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-muted: #7f8c8d;
      --border-color: #e2e8f0;
      --primary-color: #4a90e2;
      --primary-hover: #357abd;
      --accent-pink: #f26ca0;
      --accent-green: #2ecc71;
      --danger-color: #e74c3c;
      --border-radius: 12px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.08);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 260px;
      background: var(--card-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      box-shadow: var(--shadow-sm);
      z-index: 10;
    }

    .sidebar-header {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-main);
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item button {
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-item button:hover {
      background-color: #f0f4f8;
      color: var(--primary-color);
    }

    .nav-item button.active {
      background-color: #eaf2fd;
      color: var(--primary-color);
      font-weight: 600;
    }

    .user-profile {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-profile input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.85rem;
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
    }

    .board-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 24px;
    }

    /* Cards Layout */
    .grid {
      display: grid;
      gap: 20px;
    }

    .grid.top3 {
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
    }

    .card h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .progress-card .row-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .progress-card .sub {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .progress-card .big {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--primary-color);
      margin: 12px 0;
    }

    .month-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .month-nav button, .today-btn {
      padding: 8px 16px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .month-nav select {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--card-bg);
      font-weight: 500;
    }

    /* Habit Grid Table */
    .grid-container {
      overflow-x: auto;
      margin-top: 16px;
    }

    table.grid-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    table.grid-table th, table.grid-table td {
      border: 1px solid var(--border-color);
      text-align: center;
      padding: 8px 4px;
    }

    table.grid-table th.name-col, table.grid-table td.name-col {
      text-align: left;
      min-width: 220px;
      padding-left: 12px;
      position: sticky;
      left: 0;
      background: var(--card-bg);
      z-index: 2;
    }

    .habit-name-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .habit-name-wrap .txt .time {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .habit-name-wrap .icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .habit-name-wrap .pct {
      font-weight: 600;
      color: var(--primary-color);
      font-size: 0.8rem;
    }

    .habit-name-wrap button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* Interactive Checkbox Style */
    .gchk {
      cursor: pointer;
      width: 20px;
      height: 20px;
      accent-color: var(--chk-color, var(--primary-color));
      margin: 0 auto;
      display: block;
    }

    /* Heatmap / Streak */
    .badges {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .badge {
      background: #eaf2fd;
      color: var(--primary-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .heatmap-grid {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .heatmap-grid .cell {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      background: #ebedf0;
    }

    .heatmap-grid .cell.l1 { background: #9be9a8; }
    .heatmap-grid .cell.l2 { background: #40c463; }
    .heatmap-grid .cell.l3 { background: #30a14e; }
    .heatmap-grid .cell.l4 { background: #216e39; }

    /* Forms */
    .add-form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .add-form input, .add-form select, .add-form button {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .add-form button {
      background: var(--primary-color);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .add-form button:hover {
      background: var(--primary-hover);
    }

    .edit-inline {
      margin-top: 8px;
      display: flex;
      gap: 6px;
    }

    .edit-inline input, .edit-inline select {
      padding: 4px 6px;
      font-size: 0.8rem;
    }

    .edit-inline .save-btn { background: var(--accent-green); color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    .edit-inline .cancel-btn { background: var(--text-muted); color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }

    /* Expense Rows */
    .expense-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .expense-row .desc {
      font-weight: 500;
    }

    .expense-row .meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .expense-row .amt {
      font-weight: 700;
      font-size: 1rem;
    }

    .expense-row .del {
      background: none;
      border: none;
      cursor: pointer;
    }

    /* Status & Loading */
    #loadingBox {
      display: none;
      justify-content: center;
      align-items: center;
      min-height: 200px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #333;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
      z-index: 100;
      box-shadow: var(--shadow-md);
    }

    .toast.show {
      display: block;
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.8rem;
    }

    .legend .dot {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend .dot i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span>🚀 Dashboard</span>
    </div>
    <ul class="nav-list" id="sidebarNav">
      <li class="nav-item"><button class="active" onclick="switchBoard('daily')">📅 Daily Routine</button></li>
      <li class="nav-item"><button onclick="switchBoard('weekly')">📆 Weekly Goals</button></li>
      <li class="nav-item"><button onclick="switchBoard('monthly')">🎯 Monthly Habits</button></li>
      <li class="nav-item"><button onclick="switchBoard('yearly')">🌟 Yearly Aspirations</button></li>
      <li class="nav-item"><button onclick="switchBoard('expenses')">💰 Expense Tracking</button></li>
    </ul>
    <div class="user-profile">
      <input type="email" id="userEmailInput" placeholder="Enter your email..." value="user@example.com" onchange="userEmail = this.value; refreshCurrentBoard();">
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div id="loadingBox">Loading Data...</div>
    <div id="boardContent"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // Configuration & Globals
    var DEPLOYED_URL = 'https://script.google.com/macros/s/AKfycbxMMQgImJPqt-VgaxfWfAAWEcL9LM6ZMQtk7K9GVRqZD5EW1bM2m_5iftYDNpOQqe2gIg/exec';
    var userEmail = 'user@example.com';
    var activeBoard = 'daily';
    var viewYear = new Date().getFullYear();
    var viewMonth = new Date().getMonth() + 1;
    var charts = {};
    var currentExpenseData = null;

    var MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var WEEK_COLORS = ['#e3f2fd', '#f3e5f5', '#e8f5e9', '#fff3e0', '#fbe9e7'];
    var CATEGORY_COLORS = ['#4a90e2', '#f26ca0', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c', '#e74c3c'];
    var EXPENSE_BOARD = 'expenses';

    // API Helpers
    function apiGet_(action, params, onSuccess, onError) {
      var query = '?action=' + encodeURIComponent(action);
      for (var k in params) {
        if (params.hasOwnProperty(k)) {
          query += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
        }
      }
      fetch(DEPLOYED_URL + query)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.status === 'error') throw new Error(data.message);
          if (onSuccess) onSuccess(data);
        })
        .catch(function (err) {
          if (onError) onError(err);
          else showToast('API Error: ' + err.message);
        });
    }

    function apiPost_(action, payload, onSuccess, onError) {
      payload.action = action;
      fetch(DEPLOYED_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams(payload)
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.status === 'error') throw new Error(data.message);
          if (onSuccess) onSuccess(data);
        })
        .catch(function (err) {
          if (onError) onError(err);
          else showToast('API Error: ' + err.message);
        });
    }

    // App Initialization
    document.addEventListener('DOMContentLoaded', function () {
      var savedEmail = localStorage.getItem('userEmail');
      if (savedEmail) {
        userEmail = savedEmail;
        document.getElementById('userEmailInput').value = savedEmail;
      }
      document.getElementById('userEmailInput').addEventListener('change', function () {
        localStorage.setItem('userEmail', this.value);
      });
      renderBoardShell();
    });

    function switchBoard(boardKey) {
      activeBoard = boardKey;
      var buttons = document.querySelectorAll('#sidebarNav button');
      buttons.forEach(function (btn) { btn.classList.remove('active'); });
      var targetBtn = document.querySelector("#sidebarNav button[onclick*='" + boardKey + "']");
      if (targetBtn) targetBtn.classList.add('active');

      renderBoardShell();
    }

    function renderBoardShell() {
      if (activeBoard === EXPENSE_BOARD) {
        renderExpenseBoardShell();
      } else {
        renderHabitBoardShell();
      }
    }

    function refreshCurrentBoard() {
      renderBoardShell();
    }

    /* =========================================================
       HABIT / TASK BOARDS (Daily, Weekly, Monthly, Yearly)
       ========================================================= */
    function renderHabitBoardShell() {
      var titles = {
        daily: '📅 Daily Routine Board',
        weekly: '📆 Weekly Goals Board',
        monthly: '🎯 Monthly Habits Tracker',
        yearly: '🌟 Yearly Aspirations Board'
      };

      var box = document.getElementById('boardContent');
      box.innerHTML = 
        '<div class="board-title">' + (titles[activeBoard] || 'Habit Tracker') + '</div>' +
        '<div class="month-nav">' +
          '<button onclick="shiftMonth(-1)">‹</button>' +
          '<select id="monthSelect"></select>' +
          '<select id="yearSelect"></select>' +
          '<button onclick="shiftMonth(1)">›</button>' +
          '<button class="today-btn" onclick="goToday()">Today</button>' +
        '</div>' +
        '<div class="grid top3">' +
          '<div class="card progress-card">' +
            '<div class="row-top"><h3>Progress</h3><span class="sub" id="pCount">0/0 done</span></div>' +
            '<div class="big" id="pPct">0%</div>' +
            '<div style="background:#e2e8f0; height:8px; border-radius:4px; overflow:hidden;">' +
              '<div id="pBar" style="background:var(--primary-color); width:0%; height:100%; transition:width 0.3s;"></div>' +
            '</div>' +
          '</div>' +
          '<div class="card"><h3>Streak & Activity</h3><div class="badges"><span class="badge" id="currentStreakBadge">🔥 0 Day Streak</span><span class="badge" id="bestStreakBadge">🏆 0 Best</span></div><div class="heatmap-grid" id="heatmapGrid"></div></div>' +
          '<div class="card"><h3>Category Breakdown</h3><canvas id="categoryChart" height="120"></canvas></div>' +
        '</div>' +
        '<div class="card" style="margin-top:20px;">' +
          '<h3>Task Grid</h3>' +
          '<div class="grid-container"><table class="grid-table" id="gridTable"></table></div>' +
        '</div>' +
        '<div class="card" style="margin-top:20px;">' +
          '<h3>Add New Task</h3>' +
          '<div class="add-form">' +
            '<input type="text" id="taskInput" placeholder="Task name...">' +
            '<input type="date" id="taskDateInput">' +
            '<input type="time" id="taskTimeInput">' +
            '<select id="categoryInput"><option>Work</option><option>Personal</option><option>Health</option><option>Study</option><option>Other</option></select>' +
            '<select id="priorityInput"><option value="Low">Low Priority</option><option value="Medium" selected>Medium Priority</option><option value="High">High Priority</option></select>' +
            '<select id="frequencyInput"><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select>' +
            '<button onclick="addTask()">+ Add Task</button>' +
          '</div>' +
        '</div>';

      populateMonthYearSelects();
      loadMonthDashboard();
      loadStreak();
    }

    function populateMonthYearSelects() {
      var mSel = document.getElementById('monthSelect');
      var ySel = document.getElementById('yearSelect');
      if (!mSel || !ySel) return;

      mSel.innerHTML = '';
      ySel.innerHTML = '';

      MONTH_NAMES.forEach(function (name, idx) {
        var opt = document.createElement('option');
        opt.value = idx + 1;
        opt.textContent = name;
        if (idx + 1 === viewMonth) opt.selected = true;
        mSel.appendChild(opt);
      });

      var currentYear = new Date().getFullYear();
      for (var y = currentYear - 2; y <= currentYear + 2; y++) {
        var opt2 = document.createElement('option');
        opt2.value = y;
        opt2.textContent = y;
        if (y === viewYear) opt2.selected = true;
        ySel.appendChild(opt2);
      }

      mSel.addEventListener('change', function () { viewMonth = parseInt(mSel.value, 10); loadMonthDashboard(); });
      ySel.addEventListener('change', function () { viewYear = parseInt(ySel.value, 10); loadMonthDashboard(); });
      document.getElementById('taskDateInput').value = fmtDate(new Date());
    }

    function shiftMonth(delta) {
      viewMonth += delta;
      if (viewMonth > 12) { viewMonth = 1; viewYear++; }
      if (viewMonth < 1) { viewMonth = 12; viewYear--; }

      if (activeBoard === EXPENSE_BOARD) {
        document.getElementById('expMonthSelect').value = viewMonth;
        document.getElementById('expYearSelect').value = viewYear;
        loadExpenses();
      } else {
        document.getElementById('monthSelect').value = viewMonth;
        document.getElementById('yearSelect').value = viewYear;
        loadMonthDashboard();
      }
    }

    function fmtDate(d) {
      var yyyy = d.getFullYear();
      var mm = String(d.getMonth() + 1).padStart(2, '0');
      var dd = String(d.getDate()).padStart(2, '0');
      return yyyy + '-' + mm + '-' + dd;
    }

    function loadMonthDashboard() {
      document.getElementById('loadingBox').style.display = 'flex';
      apiGet_('getMonthDashboard', { email: userEmail, board: activeBoard, year: viewYear, month: viewMonth },
        function (data) {
          document.getElementById('loadingBox').style.display = 'none';
          document.getElementById('boardContent').style.display = 'block';
          renderGridTable(data);
          renderDashboardCards(data);
        },
        function (err) {
          showToast('Error loading dashboard: ' + err.message);
          document.getElementById('loadingBox').style.display = 'none';
        }
      );
    }

    function renderDashboardCards(data) {
      var pct = data.overallPct || 0;
      document.getElementById('pPct').textContent = pct + '%';
      document.getElementById('pBar').style.width = pct + '%';
      document.getElementById('pCount').textContent = (data.totalDone || 0) + '/' + (data.totalPossible || 0) + ' done';

      // Category chart
      destroyChart('category');
      var ctx = document.getElementById('categoryChart');
      if (!ctx) return;

      var cats = data.categoryStats || {};
      var labels = Object.keys(cats);
      var doneData = labels.map(function (k) { return cats[k].done; });
      var totalData = labels.map(function (k) { return cats[k].total; });

      charts.category = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            { label: 'Completed', data: doneData, backgroundColor: '#2ecc71' },
            { label: 'Total Possible', data: totalData, backgroundColor: '#e2e8f0' }
          ]
        },
        options: {
          responsive: true,
          scales: { x: { stacked: false }, y: { beginAtZero: true } }
        }
      });
    }

    function renderGridTable(data) {
      var table = document.getElementById('gridTable');
      if (!table) return;
      table.innerHTML = '';

      if (!data.habits || data.habits.length === 0) {
        table.innerHTML = '<tr><td colspan="' + (data.daysInMonth + 1) + '" class="empty-state">No tasks added for this month yet. Use the form below to add one!</td></tr>';
        return;
      }

      var thead = document.createElement('thead');
      
      // Week header row
      var trWeek = document.createElement('tr');
      trWeek.className = 'week-header';
      trWeek.innerHTML = '<th class="name-col"></th>';
      data.weeks.forEach(function (w, idx) {
        var th = document.createElement('th');
        th.colSpan = w.days.length;
        th.style.background = WEEK_COLORS[idx % WEEK_COLORS.length];
        th.textContent = w.label;
        trWeek.appendChild(th);
      });
      thead.appendChild(trWeek);

      // Day name row (Mon, Tue...)
      var trDay = document.createElement('tr');
      trDay.className = 'day-header';
      trDay.innerHTML = '<th class="name-col">TASKS</th>';
      data.dayNames.forEach(function (dn) {
        var th = document.createElement('th');
        th.textContent = dn;
        trDay.appendChild(th);
      });
      thead.appendChild(trDay);

      // Day number row (1, 2...)
      var trNum = document.createElement('tr');
      trNum.className = 'daynum-header';
      trNum.innerHTML = '<th class="name-col"></th>';
      data.dayNums.forEach(function (num) {
        var th = document.createElement('th');
        th.textContent = num;
        trNum.appendChild(th);
      });
      thead.appendChild(trNum);
      table.appendChild(thead);

      var tbody = document.createElement('tbody');
      data.habits.forEach(function (h, idx) {
        var stat = data.habitStats[idx] || { done: 0, total: 0, pct: 0 };
        var tr = document.createElement('tr');
        tr.id = 'habitRow_' + h.id;

        var tdName = document.createElement('td');
        tdName.className = 'name-col';
        tdName.innerHTML = 
          '<div class="habit-name-wrap">' +
            '<div class="txt"><b>' + escapeHtml(h.name) + '</b>' +
              '<span class="time">' + (h.time || 'All day') + ' • ' + escapeHtml(h.category) + '</span>' +
            '</div>' +
            '<div class="icons">' +
              '<span class="pct">' + stat.pct + '%</span>' +
              '<button title="Edit" onclick="showInlineEdit(\'' + h.id + '\')">✏️</button>' +
              '<button title="Delete" onclick="deleteTask(\'' + h.id + '\')">🗑️</button>' +
            '</div>' +
          '</div>' +
          '<div id="editBox_' + h.id + '" class="edit-inline" style="display:none;">' +
            '<input type="text" id="editName_' + h.id + '" value="' + escapeHtml(h.name) + '">' +
            '<input type="time" id="editTime_' + h.id + '" value="' + (h.time || '') + '">' +
            '<select id="editCat_' + h.id + '">' +
              ['Work','Personal','Health','Study','Other'].map(function(c){ return '<option ' + (h.category === c ? 'selected' : '') + '>' + c + '</option>'; }).join('') +
            '</select>' +
            '<button class="save-btn" onclick="saveInlineEdit(\'' + h.id + '\')">Save</button>' +
            '<button class="cancel-btn" onclick="hideInlineEdit(\'' + h.id + '\')">Cancel</button>' +
          '</div>';
        tr.appendChild(tdName);

        var catColor = CATEGORY_COLORS[idx % CATEGORY_COLORS.length];
        for (var day = 1; day <= data.daysInMonth; day++) {
          var td = document.createElement('td');
          var isChecked = h.checks && (h.checks[day] === true || h.checks[day] === 'true');
          
          var chk = document.createElement('input');
          chk.type = 'checkbox';
          chk.className = 'gchk';
          chk.checked = isChecked;
          chk.style.setProperty('--chk-color', catColor);
          
          // Wire up event listener directly to input element
          (function (habitId, dayNum, inputElem) {
            inputElem.addEventListener('change', function (e) {
              e.stopPropagation();
              toggleTaskCheck(habitId, dayNum, inputElem.checked);
            });
          })(h.id, day, chk);

          td.appendChild(chk);
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
    }

    function toggleTaskCheck(habitId, day, checked) {
      apiPost_('toggleTaskCheck', { email: userEmail, board: activeBoard, year: viewYear, month: viewMonth, habitId: habitId, day: day, checked: checked },
        function () { loadMonthDashboard(); loadStreak(); },
        function (err) { showToast('Failed to save check: ' + err.message); }
      );
    }

    function showInlineEdit(id) { document.getElementById('editBox_' + id).style.display = 'flex'; }
    function hideInlineEdit(id) { document.getElementById('editBox_' + id).style.display = 'none'; }

    function saveInlineEdit(id) {
      var name = document.getElementById('editName_' + id).value.trim();
      var time = document.getElementById('editTime_' + id).value;
      var cat = document.getElementById('editCat_' + id).value;
      if (!name) return;
      apiPost_('updateTask', { email: userEmail, board: activeBoard, habitId: id, name: name, time: time, category: cat },
        function () { hideInlineEdit(id); loadMonthDashboard(); },
        function (err) { showToast('Failed to update task: ' + err.message); }
      );
    }

    function deleteTask(id) {
      if (!confirm('Are you sure you want to delete this task?')) return;
      apiPost_('deleteTask', { email: userEmail, board: activeBoard, habitId: id },
        function () { loadMonthDashboard(); },
        function (err) { showToast('Failed to delete task: ' + err.message); }
      );
    }

    function addTask() {
      var input = document.getElementById('taskInput');
      var name = input.value.trim();
      if (!name) { showToast('Please enter a task name.'); return; }
      var dateStr = document.getElementById('taskDateInput').value;
      var timeStr = document.getElementById('taskTimeInput').value;
      var cat = document.getElementById('categoryInput').value;
      var prio = document.getElementById('priorityInput').value;
      var freq = document.getElementById('frequencyInput').value;

      apiPost_('addTask', {
        email: userEmail, board: activeBoard, name: name, date: dateStr,
        time: timeStr, category: cat, priority: prio, frequency: freq
      }, function () {
        input.value = '';
        showToast('Task added! 🎉');
        loadMonthDashboard();
      }, function (err) { showToast('Error adding task: ' + err.message); });
    }

    function loadStreak() {
      apiGet_('getStreakData', { email: userEmail, board: activeBoard },
        function (data) {
          document.getElementById('currentStreakBadge').textContent = '🔥 ' + data.currentStreak + ' Day Streak';
          document.getElementById('bestStreakBadge').textContent = '🏆 ' + data.bestStreak + ' Best';
          renderHeatmap(data.history);
        },
        function (err) { console.log('Streak error:', err); }
      );
    }

    function renderHeatmap(history) {
      var grid = document.getElementById('heatmapGrid');
      if (!grid) return;
      grid.innerHTML = '';
      var historyMap = {};
      (history || []).forEach(function (h) { historyMap[h.date] = h.count; });

      var today = new Date();
      var startDate = new Date();
      startDate.setDate(today.getDate() - 120);

      for (var d = new Date(startDate); d <= today; d.setDate(d.getDate() + 1)) {
        var dateKey = fmtDate(d);
        var count = historyMap[dateKey] || 0;
        var cell = document.createElement('div');
        var lvl = 'cell';
        if (count > 0 && count <= 2) lvl += ' l1';
        else if (count > 2 && count <= 4) lvl += ' l2';
        else if (count > 4 && count <= 7) lvl += ' l3';
        else if (count > 7) lvl += ' l4';
        cell.className = lvl;
        cell.title = dateKey + ': ' + count + ' tasks done';
        grid.appendChild(cell);
      }
    }

    /* =========================================================
       EXPENSE BOARD
       ========================================================= */
    function renderExpenseBoardShell() {
      var now = new Date();
      viewYear = now.getFullYear();
      viewMonth = now.getMonth() + 1;

      var box = document.getElementById('boardContent');
      box.innerHTML =
        '<div class="board-title">💰 Expense Tracking</div>' +
        '<div class="month-nav">' +
          '<button onclick="shiftMonth(-1)">‹</button>' +
          '<select id="expMonthSelect"></select>' +
          '<select id="expYearSelect"></select>' +
          '<button onclick="shiftMonth(1)">›</button>' +
          '<button class="today-btn" onclick="goToday()">Today</button>' +
        '</div>' +
        '<div class="grid top3">' +
          '<div class="card progress-card">' +
            '<div class="row-top"><h3>Total Spent This Month</h3><span class="sub" id="expCountLabel">0 expenses</span></div>' +
            '<div class="big" id="expTotalLabel">₹0.00</div>' +
          '</div>' +
          '<div class="card donut-card"><h3>By Category</h3><canvas id="expenseCategoryChart"></canvas><div class="legend" id="expenseLegend"></div></div>' +
          '<div class="card trend-card"><h3>6-Month Spending Trend</h3><canvas id="expenseTrendChart"></canvas></div>' +
        '</div>' +
        '<div class="card" style="margin-top:16px;">' +
          '<h3>Add Expense</h3>' +
          '<div class="add-form">' +
            '<input type="date" id="expDateInput">' +
            '<input type="text" id="expDescInput" placeholder="Expense description…">' +
            '<input type="number" id="expAmtInput" placeholder="Amount (₹)" step="0.01">' +
            '<select id="expCatInput"><option>Food</option><option>Transport</option><option>Bills</option><option>Shopping</option><option>Entertainment</option><option>Health</option><option>Other</option></select>' +
            '<button id="addExpenseBtn">+ Add Expense</button>' +
          '</div>' +
        '</div>' +
        '<div class="card" style="margin-top:16px;">' +
          '<h3>Expense Log</h3>' +
          '<div id="expenseList"></div>' +
        '</div>';

      var monthSel = document.getElementById('expMonthSelect');
      MONTH_NAMES.forEach(function (name, i) {
        var opt = document.createElement('option');
        opt.value = i + 1; opt.textContent = name;
        if (i + 1 === viewMonth) opt.selected = true;
        monthSel.appendChild(opt);
      });

      var yearSel = document.getElementById('expYearSelect');
      for (var y = now.getFullYear() - 2; y <= now.getFullYear() + 1; y++) {
        var opt2 = document.createElement('option');
        opt2.value = y; opt2.textContent = y;
        if (y === viewYear) opt2.selected = true;
        yearSel.appendChild(opt2);
      }

      document.getElementById('expDateInput').value = fmtDate(now);
      monthSel.addEventListener('change', function () { viewMonth = parseInt(monthSel.value, 10); loadExpenses(); });
      yearSel.addEventListener('change', function () { viewYear = parseInt(yearSel.value, 10); loadExpenses(); });
      document.getElementById('addExpenseBtn').addEventListener('click', addExpense);

      loadExpenses();
    }

    function goToday() {
      var now = new Date();
      viewYear = now.getFullYear();
      viewMonth = now.getMonth() + 1;
      if (activeBoard === EXPENSE_BOARD) {
        document.getElementById('expMonthSelect').value = viewMonth;
        document.getElementById('expYearSelect').value = viewYear;
        loadExpenses();
      } else {
        document.getElementById('monthSelect').value = viewMonth;
        document.getElementById('yearSelect').value = viewYear;
        loadMonthDashboard();
      }
    }

    function loadExpenses() {
      document.getElementById('loadingBox').style.display = 'flex';
      apiGet_('getExpenses', { email: userEmail, year: viewYear, month: viewMonth },
        renderExpenses,
        function (err) { showToast('Error loading expenses: ' + err.message); document.getElementById('loadingBox').style.display = 'none'; }
      );
    }

    function renderExpenses(data) {
      currentExpenseData = data;
      document.getElementById('loadingBox').style.display = 'none';
      document.getElementById('boardContent').style.display = 'block';

      var total = data.totalSpent || 0;
      document.getElementById('expTotalLabel').textContent = '₹' + total.toFixed(2);
      document.getElementById('expCountLabel').textContent = (data.expenses ? data.expenses.length : 0) + ' expenses';

      var list = document.getElementById('expenseList');
      list.innerHTML = '';
      if (!data.expenses || data.expenses.length === 0) {
        list.innerHTML = '<div class="empty-state">No expenses logged for this month.</div>';
      } else {
        data.expenses.forEach(function (exp) {
          var row = document.createElement('div');
          row.className = 'expense-row';
          row.innerHTML =
            '<div class="desc">' + escapeHtml(exp.description) + '<div class="meta">' + exp.date + ' • ' + escapeHtml(exp.category) + '</div></div>' +
            '<div class="amt">₹' + parseFloat(exp.amount).toFixed(2) + '</div>' +
            '<button class="icon-btn del" onclick="deleteExpense(\'' + exp.id + '\')">🗑️</button>';
          list.appendChild(row);
        });
      }

      renderExpenseCategoryChart(data.byCategory || {});
      renderExpenseTrendChart(data.trend || []);
    }

    function addExpense() {
      var desc = document.getElementById('expDescInput').value.trim();
      var amt = parseFloat(document.getElementById('expAmtInput').value);
      var date = document.getElementById('expDateInput').value;
      var cat = document.getElementById('expCatInput').value;

      if (!desc || isNaN(amt) || amt <= 0) {
        showToast('Please enter a valid description and amount.');
        return;
      }

      apiPost_('addExpense', { email: userEmail, description: desc, amount: amt, date: date, category: cat },
        function () {
          document.getElementById('expDescInput').value = '';
          document.getElementById('expAmtInput').value = '';
          showToast('Expense added! 💸');
          loadExpenses();
        },
        function (err) { showToast('Error adding expense: ' + err.message); }
      );
    }

    function deleteExpense(id) {
      if (!confirm('Delete this expense?')) return;
      apiPost_('deleteExpense', { email: userEmail, id: id },
        function () { loadExpenses(); },
        function (err) { showToast('Error deleting expense: ' + err.message); }
      );
    }

    function renderExpenseCategoryChart(byCategory) {
      destroyChart('expenseCat');
      var ctx = document.getElementById('expenseCategoryChart');
      if (!ctx) return;

      var labels = Object.keys(byCategory);
      var values = labels.map(function (k) { return byCategory[k]; });

      if (labels.length === 0) {
        labels = ['No Data'];
        values = [1];
      }

      charts.expenseCat = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{ data: values, backgroundColor: CATEGORY_COLORS, borderWidth: 2, borderColor: '#fff' }]
        },
        options: { cutout: '65%', plugins: { legend: { display: false } } }
      });

      var legend = document.getElementById('expenseLegend');
      if (legend) {
        legend.innerHTML = '';
        labels.forEach(function (lbl, i) {
          if (lbl === 'No Data') return;
          var dot = document.createElement('span');
          dot.className = 'dot';
          dot.innerHTML = '<i style="background:' + CATEGORY_COLORS[i % CATEGORY_COLORS.length] + '"></i>' + lbl + ' (₹' + values[i].toFixed(0) + ')';
          legend.appendChild(dot);
        });
      }
    }

    function renderExpenseTrendChart(trend) {
      destroyChart('expenseTrend');
      var ctx = document.getElementById('expenseTrendChart');
      if (!ctx) return;

      var labels = trend.map(function (t) { return t.month; });
      var values = trend.map(function (t) { return t.total; });

      charts.expenseTrend = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{ data: values, backgroundColor: '#F26CA0', borderRadius: 6 }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false } },
            y: { ticks: { callback: function (v) { return '₹' + v; } } }
          }
        }
      });
    }

    /* =========================================================
       UTILITIES
       ========================================================= */
    function destroyChart(name) {
      if (charts[name]) {
        charts[name].destroy();
        delete charts[name];
      }
    }

    function showToast(msg) {
      var t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function () { t.classList.remove('show'); }, 3000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
